  function go(screen,id){if(id)state.selected=id;state.screen=screen;closeSheet();render();save();}
  function closeSheet(){layer.hidden=true;layer.innerHTML='';}
  function sheet(title,body){layer.innerHTML='<section class="im-sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="im-sheet-heading"><h2>'+title+'</h2><button type="button" data-action="close" aria-label="关闭">'+icon('x')+'</button></div>'+body+'</section>';layer.hidden=false;icons();const focus=layer.querySelector('input,button');if(focus)focus.focus();}
  function deviceCard(d){const unassigned=d.owner==='待登记';return '<button type="button" class="im-device" data-device="'+d.id+'" aria-label="查看'+d.name+'"><div class="im-device-head"><div class="im-machine">'+icon('cpu')+'</div><div class="im-device-name"><h3>'+d.name+'</h3><p>'+d.model+'</p></div><span class="im-state '+(d.online?'':'off')+'">'+(d.online?'在线':'离线')+'</span></div><div class="im-device-mid"><span class="im-reading">'+(d.online?d.hz.toFixed(1):'—')+'<small>Hz</small></span><div class="im-tags"><span class="im-tag '+(d.run?'green':'')+'">'+(!d.online?'状态待更新':d.run?'运行中':'已停机')+'</span><span class="im-tag '+(d.expired?'red':d.control?'blue':'')+'">'+(d.expired?'租赁到期':d.control?'可控制':'仅查看')+'</span></div></div><div class="im-lease-line '+(d.expired?'expired':d.days<=7?'warn':'')+'"><span>'+(unassigned?'尚未登记租赁合同':d.expired?'已到期 · 停机已确认':d.due+' 到期')+'</span><span>'+(unassigned?'待登记':d.expired?'查看租期':d.days<=7?'剩余 '+d.days+' 天':d.own?'第一所有人':'他人设备')+icon('chevron-right')+'</span></div></button>';}
  function drawList(){const box=content.querySelector('.im-devices');if(!box)return;const list=devices.filter(function(d){return (!state.query||(d.name+d.model+d.module).toLowerCase().includes(state.query.toLowerCase()))&&(state.filter==='all'||state.filter==='control'&&d.control&&!d.expired||state.filter==='view'&&!d.control);});box.innerHTML=list.length?list.map(deviceCard).join(''):'<p class="im-empty">没有找到相关设备</p>';icons();}
  function devicesPage(){content.innerHTML='<div class="im-intro"><div><h1>我的设备</h1><p>设备状态，一目了然</p></div><button type="button" class="im-scan" data-action="scan" aria-label="扫码添加设备">'+icon('scan-line')+'</button></div><div class="im-summary"><div><strong>'+devices.length+'</strong><span>全部设备</span></div><div><strong>'+devices.filter(function(d){return d.online;}).length+'</strong><span>当前在线</span></div><div><strong>'+devices.filter(function(d){return d.days>0&&d.days<=7;}).length+'</strong><span>即将到期</span></div></div><label class="im-search">'+icon('search')+'<input id="im-search" aria-label="搜索设备名称或编号" placeholder="搜索设备名称 / 编号" value="'+esc(state.query)+'"></label><div class="im-filters" aria-label="设备筛选"><button type="button" data-filter="all" aria-pressed="'+(state.filter==='all')+'">全部设备</button><button type="button" data-filter="control" aria-pressed="'+(state.filter==='control')+'">可控制</button><button type="button" data-filter="view" aria-pressed="'+(state.filter==='view')+'">仅查看</button></div><div class="im-devices"></div>';drawList();}
  function banner(d){if(d.expired)return '<div class="im-banner red">'+icon('circle-alert')+'<div>租赁已到期 · 自动停机已确认<p>续租后可恢复控制，请联系管理员。</p></div></div>';if(!d.online)return '<div class="im-banner">'+icon('wifi-off')+'<div>设备离线，当前状态待更新<p>最后连接：今天 13:18，控制暂不可用。</p></div></div>';if(!d.control)return '<div class="im-banner blue">'+icon('lock-keyhole')+'<div>当前权限：仅查看<p>启停、调频与复位需由管理员授权。</p></div></div>';if(d.days<=7)return '<button type="button" class="im-banner" style="width:100%" data-action="rental">'+icon('calendar-clock')+'<div>租期剩余 '+d.days+' 天<p>'+d.due+' 18:00 到期，未续租将自动停机。</p></div></button>';return '';}
  function detailPage(){const d=selected();const can=d.online&&d.control&&!d.expired;content.innerHTML='<div class="im-detail-head"><div><h2>'+d.name+'</h2><p>'+d.model+' · '+(d.own?'第一所有人：':'所属人：')+d.owner+'</p></div><span class="im-state '+(d.online?'':'off')+'">'+(d.online?'在线':'离线')+'</span></div>'+banner(d)+'<section class="im-frequency"><div class="im-frequency-label"><span>实际运行频率</span><span class="im-tag '+(d.run&&d.online?'green':'')+'">'+(!d.online?'状态待更新':d.run?'运行中':'已停机')+'</span></div><div class="im-big-number">'+(d.online?d.hz.toFixed(1):'—')+'<span>Hz</span></div><div class="im-meter"><i style="width:'+(d.online?Math.min(100,d.hz/80*100):0)+'%"></i></div><div class="im-set-frequency"><span>设定频率 <strong>'+d.target.toFixed(1)+' Hz</strong></span><button type="button" data-action="frequency" '+(can?'':'disabled')+'>'+icon('sliders-horizontal')+'调整</button></div></section><div class="im-metrics"><div><p>输出电流</p><strong>'+(d.online?d.current.toFixed(1):'—')+'</strong><small>A</small></div><div><p>输出电压</p><strong>'+(d.online?d.voltage:'—')+'</strong><small>V</small></div><div><p>母线电压</p><strong>'+(d.online?d.bus:'—')+'</strong><small>V</small></div></div><div class="im-section-line"><h3>设备控制</h3><span>'+(d.control?'管理员已授权':'当前仅查看')+'</span></div><div class="im-command-grid"><button type="button" class="start" data-command="start" '+(can&&!d.run?'':'disabled')+'>'+icon('play')+'启动</button><button type="button" class="stop" data-command="stop" '+(d.online&&d.control&&d.run?'':'disabled')+'>'+icon('square')+'停止</button><button type="button" data-command="reset" '+(can?'':'disabled')+'>'+icon('rotate-ccw')+'故障复位</button></div><p class="im-updated">'+(d.online?'数据更新于 14:32:08 · 4G 信号良好':'离线数据不代表设备当前状态')+'</p><div class="im-links"><button type="button" class="im-link" data-action="history"><span>'+icon('chart-no-axes-combined')+'历史运行数据</span>'+icon('chevron-right')+'</button><button type="button" class="im-link" data-action="rental"><span>'+icon('file-clock')+'租赁与设备信息</span>'+icon('chevron-right')+'</button></div>';}
  function rentalPage(){const d=selected(),unassigned=d.owner==='待登记';content.innerHTML='<h1>租赁信息</h1><p class="im-note">'+d.name+'</p>'+banner(d)+'<div class="im-info-list">'+[['第一所有人',d.owner],['绑定手机号',unassigned?'待登记':d.own?'138 **** 2608':'139 **** 0516'],['合同编号',unassigned?'待登记':'ZL-2026-10'+d.id],['租赁方式','按月租赁'],['到期时间',unassigned?'待登记':d.due+' 18:00'],['我的权限',d.expired?'到期限制中':d.control?'查看、启停、调频、复位':'仅查看']].map(function(r){return '<div class="im-info-row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('')+'</div><div class="im-section-line"><h3>设备档案</h3></div><div class="im-info-list">'+[['设备型号',d.model],['厂商代号','HN（示例）'],['4G 模块 ID',d.module]].map(function(r){return '<div class="im-info-row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('')+'</div><p class="im-note">续租及权限变更，请联系租赁管理员。第一所有人以后台合同登记为准。</p>';}
  function historyPage(){const d=selected();const current=state.metric==='current';const unit=current?'A':'Hz';const vals=current?[6.4,6.5,0,0,6.6,6.7]:[42,42,0,0,42,42];content.innerHTML='<h1>历史数据</h1><p class="im-note">'+d.name+' · 2026-10-21</p><div class="im-history-controls"><div class="im-segment"><button type="button" data-metric="frequency" aria-pressed="'+(!current)+'">频率</button><button type="button" data-metric="current" aria-pressed="'+current+'">电流</button></div><div class="im-segment"><button type="button" data-history-view="chart" aria-pressed="'+(state.historyView==='chart')+'">曲线</button><button type="button" data-history-view="table" aria-pressed="'+(state.historyView==='table')+'">表格</button></div></div><div class="im-chart-panel"><div class="im-chart-title"><span>'+(current?'输出电流':'实际频率')+' / '+unit+'</span><span>今天</span></div>'+(state.historyView==='chart'?'<svg class="im-chart" viewBox="0 0 320 210" role="img" aria-label="示例运行曲线，8点至10点停机，随后恢复运行"><path class="im-gridline" d="M35 20H302M35 60H302M35 100H302M35 140H302M35 180H302"/><text x="7" y="24">'+(current?'8':'50')+'</text><text x="7" y="104">'+(current?'4':'25')+'</text><text x="15" y="184">0</text><text x="35" y="205">00:00</text><text x="116" y="205">06:00</text><text x="198" y="205">12:00</text><text x="270" y="205">18:00</text><path class="im-curve" d="M35 48 L65 48 L89 46 L116 48 L140 48 L141 180 L181 180 L182 48 L213 47 L241 48 L271 45 L302 46"/></svg>':'<table class="im-data-table"><thead><tr><th>时间</th><th>'+(current?'电流 / A':'频率 / Hz')+'</th></tr></thead><tbody>'+vals.map(function(v,i){return '<tr><td>'+['00:00','04:00','08:00','10:00','12:00','14:30'][i]+'</td><td>'+v.toFixed(1)+'</td></tr>';}).join('')+'</tbody></table>')+'</div><p class="im-note">示例历史记录 · 每项指标独立显示单位</p>';}
  function messagesPage(){content.innerHTML='<div class="im-intro"><div><h1>消息</h1><p>租赁提醒与设备动态</p></div>'+icon('bell')+'</div><article class="im-message"><div class="im-message-head"><span>'+icon('calendar-clock')+'</span><h3>租期剩余 3 天</h3><small>今天 09:00</small></div><p>东区 01 号变频器将于 10 月 24 日 18:00 到期。未续租将自动停机，请及时联系管理员。</p><button type="button" data-open-rental="01">查看租赁信息'+icon('chevron-right')+'</button></article><article class="im-message"><div class="im-message-head"><span>'+icon('power')+'</span><h3>到期停机已确认</h3><small>昨天 18:00</small></div><p>备用 04 号变频器已到期，设备已反馈停机。续租后可恢复控制权限。</p><button type="button" data-device="04">查看设备'+icon('chevron-right')+'</button></article><article class="im-message"><div class="im-message-head"><span>'+icon('shield-check')+'</span><h3>设备权限已更新</h3><small>10-18 10:24</small></div><p>管理员已为你开通东区 01 号变频器的启停、调频和故障复位权限。</p><button type="button" data-device="01">查看设备'+icon('chevron-right')+'</button></article>';}
  function profilePage(){content.innerHTML='<div class="im-person"><div class="im-avatar">陈</div><div><h2>陈先生</h2><p>138 **** 2608 · 微信绑定手机号</p></div></div><div class="im-rental-overview"><p>我的承租设备</p><div class="im-overview-row"><div><strong>3</strong><span>台</span></div><span class="im-small">1 台即将到期</span></div></div><div class="im-links"><button type="button" class="im-link" data-action="rental"><span>'+icon('file-text')+'租赁信息</span>'+icon('chevron-right')+'</button><button type="button" class="im-link" data-action="sms"><span>'+icon('message-square')+'短信提醒服务</span><small>暂未开放充值</small>'+icon('chevron-right')+'</button><button type="button" class="im-link" data-action="account"><span>'+icon('smartphone')+'账号信息</span>'+icon('chevron-right')+'</button></div><p class="im-note">设备归属以管理员登记的合同为准。每台设备的操作权限由管理员单独授予。</p>';}
  function smsPage(){content.innerHTML='<h1>短信提醒</h1><p class="im-note">到期前 7 天、3 天、1 天提醒</p><div class="im-rental-overview"><p>短信服务余额</p><div class="im-overview-row"><div><span>¥ </span><strong>0.00</strong></div><span class="im-small">按条计费</span></div></div><div class="im-info-list"><div class="im-info-row"><span>服务状态</span><span>未开通</span></div><div class="im-info-row"><span>接收手机号</span><span>138 **** 2608</span></div><div class="im-info-row"><span>计费单价</span><span>待公布</span></div></div><button type="button" class="im-primary" disabled>充值暂未开放</button><p class="im-note">短信费用与设备租金分别管理。短信服务状态不影响租期计算与到期停机。</p>';}
  function render(){root.style.setProperty('--im-gap',state.gap+'px');root.classList.toggle('im-compact',state.layout==='compact');const sub=!['devices','messages','profile'].includes(state.screen);root.querySelector('#im-back').hidden=!sub;root.querySelector('#im-bottom').hidden=sub;root.querySelector('#im-navtitle').textContent=sub?({detail:'设备详情',history:'历史数据',rental:'租赁信息',sms:'短信服务'}[state.screen]||'云控租赁'):'云控租赁';({devices:devicesPage,detail:detailPage,history:historyPage,rental:rentalPage,messages:messagesPage,profile:profilePage,sms:smsPage}[state.screen]||devicesPage)();root.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===state.screen);b.setAttribute('aria-current',b.dataset.nav===state.screen?'page':'false');});icons();}
  function frequencySheet(){const d=selected();if(!d.control||!d.online||d.expired)return;sheet('调整运行频率','<p class="im-hint">'+d.name+' · 当前设定 '+d.target.toFixed(1)+' Hz</p><label class="im-field">目标频率 / Hz<input id="im-target" type="number" min="0" max="80" step="0.1" value="'+d.target+'"></label><label class="im-field">允许范围 0–80 Hz<input id="im-range" type="range" min="0" max="80" step="0.1" value="'+d.target+'" aria-label="调整目标频率"></label><p id="im-form-error" class="im-error" role="alert"></p><div class="im-sheet-footer"><button type="button" class="im-secondary" data-action="close">取消</button><button type="button" class="im-primary" data-action="apply-frequency">确认调整</button></div>');}
  function command(cmd){const d=selected();if(!d.control||!d.online||d.expired&&cmd!=='stop')return;const label={start:'启动',stop:'停止',reset:'故障复位'}[cmd];sheet('确认'+label,'<p class="im-hint">'+d.name+'</p><p>将'+(cmd==='start'?'按设定频率 '+d.target.toFixed(1)+' Hz 启动设备':cmd==='stop'?'停止当前设备运行':'向设备下发故障复位指令')+'。</p><div class="im-sheet-footer"><button type="button" class="im-secondary" data-action="close">取消</button><button type="button" class="im-primary" data-confirm-command="'+cmd+'">确认'+label+'</button></div>');}
  root.addEventListener('input',function(e){if(e.target.id==='im-search'){state.query=e.target.value;drawList();}if(e.target.id==='im-range')root.querySelector('#im-target').value=e.target.value;if(e.target.id==='im-target')root.querySelector('#im-range').value=e.target.value;});
  root.addEventListener('click',function(e){const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){go(b.dataset.nav);return;}if(b.id==='im-back'){go(['history','rental'].includes(state.screen)?'detail':state.screen==='sms'?'profile':'devices');return;}if(b.dataset.device){go('detail',b.dataset.device);return;}if(b.dataset.openRental){go('rental',b.dataset.openRental);return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();save();return;}if(b.dataset.metric){state.metric=b.dataset.metric;render();save();return;}if(b.dataset.historyView){state.historyView=b.dataset.historyView;render();save();return;}if(b.dataset.command){command(b.dataset.command);return;}if(b.dataset.confirmCommand){const d=selected();const c=b.dataset.confirmCommand;b.disabled=true;b.textContent='等待设备反馈…';setTimeout(function(){if(c==='stop'){d.run=false;d.hz=0;d.current=0;d.voltage=0;}if(c==='start'){d.run=true;d.hz=d.target;d.current=6.7;d.voltage=311;}closeSheet();render();toast('模拟执行成功 · '+({stop:'设备已停止',start:'设备已启动',reset:'复位指令已确认'}[c]));save();},500);return;}const a=b.dataset.action;if(a==='close')closeSheet();if(a==='frequency')frequencySheet();if(a==='rental'||a==='history'||a==='sms')go(a);if(a==='account')sheet('账号信息','<div class="im-info-row"><span>用户姓名</span><span>陈先生</span></div><div class="im-info-row"><span>微信绑定手机号</span><span>138 **** 2608</span></div><p class="im-hint">设备授权与此手机号关联。</p>');if(a==='apply-frequency'){const input=root.querySelector('#im-target');const v=Number(input.value);if(input.value.trim()===''||!Number.isFinite(v)||v<0||v>80){root.querySelector('#im-form-error').textContent='请输入 0–80 之间的频率。';return;}const d=selected();d.target=Math.round(v*10)/10;if(d.run)d.hz=d.target;closeSheet();render();toast('模拟执行成功 · 设定频率 '+d.target.toFixed(1)+' Hz');save();}if(a==='scan')sheet('扫码添加设备','<div class="im-banner blue">'+icon('scan-line')+'<div>示例扫码结果<p>添加后仅可查看，控制权限由管理员授予。</p></div></div><div class="im-info-list"><div class="im-info-row"><span>厂商代号</span><span>HN</span></div><div class="im-info-row"><span>变频器型号</span><span>VF-22</span></div><div class="im-info-row"><span>4G 模块 ID</span><span>DEMO4G001005</span></div></div><button type="button" class="im-primary" data-action="add-device">确认添加 · 仅查看</button>');if(a==='add-device'){if(!devices.find(function(d){return d.id==='05';}))devices.push({id:'05',name:'新增 05 号变频器',model:'VF-22 / 22 kW',module:'DEMO4G001005',online:true,run:false,hz:0,target:40,current:0,voltage:0,bus:530,control:false,owner:'待登记',own:false,due:'未登记租期',days:99,expired:false});state.filter='all';state.query='';go('detail','05');toast('已添加示例设备 · 当前仅查看');}});
  root.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&!layer.hidden){const f=Array.from(layer.querySelectorAll('button:not(:disabled),input'));if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:function(){render();save();}});tweak.addSelect(state,'layout',{label:'设备列表样式',options:[{label:'信息卡片',value:'cards'},{label:'紧凑列表',value:'compact'}]});tweak.addSlider(state,'gap',{label:'卡片间距',min:8,max:20,step:2,unit:'px'});}
})();
</script>
