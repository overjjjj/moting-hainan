  function heading(title,subtitle,action,label,ic){return '<div class="ia-heading"><div><h1>'+title+'</h1><p>'+subtitle+'</p></div>'+(action?'<button type="button" class="ia-primary" data-action="'+action+'">'+icon(ic||'plus')+label+'</button>':'')+'</div>';}
  function badge(d){if(!d.owner)return '<span class="ia-status">待出租</span>';if(d.expired)return '<span class="ia-status red">已到期</span>';if(days(d)<=7)return '<span class="ia-status amber">即将到期</span>';return '<span class="ia-status green">租赁中</span>';}
  function ownerCell(d){const u=user(d.owner);return u?'<span>'+u.name+'</span><small>'+u.phone+'</small>':'<span style="color:var(--ia-muted)">未登记</span>';}
  function leaseCell(d){return d.due?'<span class="ia-mono">'+d.due+'</span><small>'+(d.expired?'已到期':days(d)<=7?'剩余 '+days(d)+' 天':'18:00 到期')+'</small>':'<span style="color:var(--ia-muted)">待登记租期</span>';}
  function filtered(){return devices.filter(function(d){return (!state.query||(d.name+d.model+d.module+(user(d.owner)||{}).phone).toLowerCase().includes(state.query.toLowerCase()))&&(state.filter==='all'||state.filter==='rented'&&d.owner&&!d.expired||state.filter==='stock'&&!d.owner||state.filter==='expired'&&d.expired);});}
  function drawDeviceRows(){const list=filtered(),body=main.querySelector('#ia-device-rows');if(!body)return;body.innerHTML=list.length?list.map(function(d){return '<tr><td><div class="ia-device-name">'+esc(d.name)+'</div><small>'+esc(d.model)+' · '+esc(d.module.slice(-6))+'</small></td><td>'+ownerCell(d)+'</td><td>'+badge(d)+'<small><i class="ia-dot '+(d.online?'':'off')+'"></i>'+(d.online?(d.run?'在线 · 运行中':'在线 · 已停机'):'离线 · 状态待更新')+'</small></td><td>'+leaseCell(d)+'</td><td><div class="ia-table-actions"><button type="button" class="ia-text-button" data-authorize="'+d.id+'">授权</button><button type="button" class="ia-text-button" data-info="'+d.id+'">详情</button></div></td></tr>';}).join(''):'<tr><td colspan="5" class="ia-empty">没有找到相关设备</td></tr>';main.querySelector('#ia-result-count').textContent='共 '+list.length+' 台设备';}
  function devicePage(){const rented=devices.filter(function(d){return d.owner&&!d.expired;}).length,near=devices.filter(function(d){return d.owner&&!d.expired&&days(d)<=7;}).length,expired=devices.filter(function(d){return d.expired;}).length;main.innerHTML=heading('设备管理','管理设备档案、租赁状态和用户权限','stock','扫码入库','scan-line')+'<div class="ia-stats">'+[[devices.length,'全部设备','boxes','已建立设备档案'],[rented,'租赁中','activity','当前有效租约'],[near,'7 天内到期','calendar-clock','需要跟进续租'],[expired,'租赁已到期','circle-alert','查看停机执行结果']].map(function(s){return '<div class="ia-stat"><div class="ia-stat-label">'+s[1]+icon(s[2])+'</div><strong>'+s[0]+'</strong><small>'+s[3]+'</small></div>';}).join('')+'</div><section class="ia-panel"><div class="ia-toolbar"><div class="ia-tabs">'+[['all','全部设备'],['rented','租赁中'],['stock','待出租'],['expired','已到期']].map(function(t){return '<button type="button" data-filter="'+t[0]+'" aria-pressed="'+(state.filter===t[0])+'">'+t[1]+'</button>';}).join('')+'</div><label class="ia-search">'+icon('search')+'<input id="ia-search" aria-label="搜索设备或手机号" placeholder="设备名称 / 模块 ID / 手机号" value="'+esc(state.query)+'"></label></div><div class="ia-table-wrap"><table class="ia-table"><thead><tr><th>设备名称 / 型号</th><th>第一所有人</th><th>租赁 / 运行状态</th><th>租赁到期时间</th><th>操作</th></tr></thead><tbody id="ia-device-rows"></tbody></table></div><div class="ia-table-foot"><span id="ia-result-count"></span><span>已显示全部结果</span></div></section><p class="ia-note">用户扫码添加设备后默认仅查看。第一所有人依据合同登记，控制权限由管理员单独授予。</p>';drawDeviceRows();}
  function leasesPage(){const ds=devices.filter(function(d){return d.owner;});main.innerHTML=heading('租赁合同','合同、承租人、租期与付款记录统一管理','contract','登记租赁','file-plus-2')+'<section class="ia-panel"><div class="ia-toolbar"><h3>当前租赁记录</h3><span class="ia-note" style="margin:0">'+ds.length+' 份合同</span></div><div class="ia-table-wrap"><table class="ia-table"><thead><tr><th>合同 / 设备</th><th>第一所有人</th><th>月租金额</th><th>租期至</th><th>状态</th><th>操作</th></tr></thead><tbody>'+ds.map(function(d){return '<tr><td><span class="ia-mono">'+esc(d.contract)+'</span><small>'+esc(d.name)+'</small></td><td>'+ownerCell(d)+'</td><td class="ia-mono">¥ '+Number(d.rent).toFixed(2)+'<small>已登记付款</small></td><td>'+leaseCell(d)+'</td><td>'+badge(d)+'</td><td><button type="button" class="ia-text-button" data-renew="'+d.id+'">登记续租</button></td></tr>';}).join('')+'</tbody></table></div></section><p class="ia-note">合同及金额均为示例。续租登记后更新到期时间，重新安排提醒和停机计划，设备不会自动启动。</p>';}
  function permissionPage(){const d=getDevice();draft=JSON.parse(JSON.stringify(permissions[d.id]||initialPermissions));main.innerHTML=heading('用户授权','按设备、按用户分别设置查看和控制权限')+'<section class="ia-panel"><div class="ia-permission-summary"><div><h3>'+esc(d.name)+'</h3><p>第一所有人：'+(user(d.owner)?user(d.owner).name+' · '+user(d.owner).phone:'待合同登记')+'</p></div><select id="ia-perm-device" class="ia-select" aria-label="选择授权设备">'+devices.map(function(x){return '<option value="'+x.id+'" '+(d.id===x.id?'selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select></div><div class="ia-table-wrap"><table class="ia-table ia-perm-table"><thead><tr><th>已添加设备的用户</th><th>查看</th><th>启动 / 停止</th><th>修改频率</th><th>故障复位</th></tr></thead><tbody>'+users.map(function(u){return '<tr><td><span>'+u.name+'</span> '+(u.id===d.owner?'<span class="ia-status blue">第一所有人</span>':'<span class="ia-status">关联用户</span>')+'<small>'+u.phone+'</small></td>'+['view','control','frequency','reset'].map(function(p){return '<td><label class="ia-perm-check"><input type="checkbox" data-user="'+u.id+'" data-perm="'+p+'" aria-label="'+u.name+' '+({view:'查看',control:'启停',frequency:'调频',reset:'复位'}[p])+'" '+(draft[u.id][p]?'checked':'')+'></label></td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div><div class="ia-permission-footer"><span id="ia-permission-status">扫码默认仅查看，勾选后保存授权。</span><button type="button" class="ia-primary" data-action="save-permissions">'+icon('check')+'保存授权</button></div></section><div class="ia-information">'+icon('shield-check')+'<span>第一所有人身份与控制权限分别管理。在此调整权限，不会改变合同承租人。</span></div>';}
  function dateBefore(d,n){const dt=new Date(d.due+'T12:00:00+08:00');dt.setUTCDate(dt.getUTCDate()-n);return dt.toISOString().slice(5,10);}
  function remindersPage(){const ds=devices.filter(function(d){return d.owner&&(d.expired||days(d)<=7);});main.innerHTML=heading('到期与提醒','提前 7 / 3 / 1 天提醒，到期未续租自动停机')+'<section class="ia-panel">'+ds.map(function(d){return '<article class="ia-rental-item"><div><h3>'+d.name+' '+badge(d)+'</h3><p>第一所有人：'+user(d.owner).name+' · '+user(d.owner).phone+'</p><p>到期时间：'+d.due+' 18:00</p>'+(d.expired?'<span class="ia-status '+(d.online?'green':'amber')+'">'+(d.online?'设备停机已确认':'已到期 · 停机待确认')+'</span>':'<div class="ia-timeline"><span>'+dateBefore(d,7)+' · 提前 7 天</span><i></i><span class="active">'+dateBefore(d,3)+' · 提前 3 天</span><i></i><span>'+dateBefore(d,1)+' · 提前 1 天</span></div>')+'</div><div><button type="button" class="ia-secondary" data-renew="'+d.id+'">登记续租</button></div></article>';}).join('')+'</section><div class="ia-section-gap" style="height:22px"></div><section class="ia-panel"><div class="ia-toolbar"><h3>短信服务</h3><span class="ia-status">充值接口预留</span></div><div style="padding:18px"><div class="ia-information" style="margin:0">'+icon('message-square')+'<span>短信按条扣费，费用与设备租金分开。充值方式、计费单价及发送渠道待配置。</span></div><p class="ia-note">短信未发送或余额不足，不改变设备租期和到期停机规则。</p></div></section>';}
  function logsPage(){main.innerHTML=heading('操作记录','查看授权、租赁变更和设备控制的执行结果')+'<section class="ia-panel"><div class="ia-table-wrap"><table class="ia-table"><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>设备</th><th>结果</th></tr></thead><tbody>'+logs.map(function(l){return '<tr><td class="ia-mono">'+esc(l.time)+'</td><td>'+esc(l.who)+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.device)+'</td><td>'+esc(l.result)+'</td></tr>';}).join('')+'</tbody></table></div></section>';}
  function render(){root.style.setProperty('--ia-row-space',state.rowSpace+'px');root.querySelector('#ia-breadcrumb').textContent=titles[state.page];root.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false');});({devices:devicePage,leases:leasesPage,permissions:permissionPage,reminders:remindersPage,logs:logsPage}[state.page]||devicePage)();icons();}
  function go(page,id){if(id)state.selected=id;state.page=page;close();render();save();}
  function stockModal(){modal('扫码入库','扫描设备二维码，解析厂商、型号和 4G 模块 ID。','<label class="ia-field">二维码内容（示例分隔格式）<input id="ia-qr" value="HN|VF-22|DEMO4G001006" autocomplete="off"></label><button type="button" class="ia-secondary" data-action="parse">'+icon('scan-line')+'解析示例二维码</button><div id="ia-parse-output"></div><p id="ia-form-error" class="ia-error" role="alert"></p><div class="ia-modal-footer"><button type="button" class="ia-secondary" data-action="close">取消</button><button type="button" class="ia-primary" id="ia-stock-save" data-action="stock-save" disabled>确认入库</button></div>');}
  function parseQr(){const raw=root.querySelector('#ia-qr').value.trim(),parts=raw.split('|');parsed=null;root.querySelector('#ia-stock-save').disabled=true;root.querySelector('#ia-parse-output').innerHTML='';const error=root.querySelector('#ia-form-error');if(parts.length!==3||parts.some(function(v){return !/^[A-Za-z0-9_-]{2,40}$/.test(v);})){error.textContent='示例格式：厂商代号|变频器型号|4G模块ID';return;}if(devices.some(function(d){return d.module===parts[2];})){error.textContent='该 4G 模块已存在，请勿重复入库。';return;}parsed={vendor:parts[0],model:parts[1],module:parts[2]};error.textContent='';root.querySelector('#ia-parse-output').innerHTML='<div class="ia-parse-grid"><div><small>厂商代号</small>'+esc(parts[0])+'</div><div><small>变频器型号</small>'+esc(parts[1])+'</div><div><small>4G 模块 ID</small>'+esc(parts[2])+'</div></div>';root.querySelector('#ia-stock-save').disabled=false;}
  function infoModal(id){const d=getDevice(id);modal('设备档案',d.name,'<div class="ia-detail-grid">'+[['设备编号','INV-'+d.id],['厂商 / 型号',d.vendor+' / '+d.model],['4G 模块 ID',d.module],['第一所有人',user(d.owner)?user(d.owner).name:'未登记'],['通信状态',d.online?'在线':'离线'],['运行状态',!d.online?'待更新':d.run?'运行中':'已停机'],['租期至',d.due||'未登记'],['合同编号',d.contract||'未登记']].map(function(r){return '<div><small>'+r[0]+'</small>'+esc(r[1])+'</div>';}).join('')+'</div><div class="ia-modal-footer"><button type="button" class="ia-primary" data-authorize="'+d.id+'">管理用户授权</button></div>');}
  function contractModal(){const stock=devices.filter(function(d){return !d.owner;});if(!stock.length){toast('请先入库待出租设备。');return;}modal('登记租赁合同','合同签约用户将登记为第一所有人。','<label class="ia-field">出租设备<select id="ia-contract-device">'+stock.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>';}).join('')+'</select></label><label class="ia-field">合同签约用户 / 微信绑定手机号<select id="ia-contract-owner">'+users.map(function(u){return '<option value="'+u.id+'">'+u.name+' · '+u.phone+'</option>';}).join('')+'</select></label><div class="ia-fields"><label class="ia-field">合同编号<input id="ia-contract-no" value="ZL-2026-1005"></label><label class="ia-field">月租金额 / 元<input id="ia-rent" type="number" min="0.01" step="0.01" placeholder="填写合同金额"></label><label class="ia-field">起租日期<input id="ia-start" type="date" value="2026-10-21"></label><label class="ia-field">到期日期（18:00）<input id="ia-end" type="date" value="2026-11-21"></label></div><label class="ia-field" style="display:flex;align-items:center;gap:8px"><input id="ia-paid" type="checkbox" style="width:16px;margin:0;accent-color:var(--ia-brand)">已核对合同及本期付款</label><p id="ia-form-error" class="ia-error" role="alert"></p><div class="ia-modal-footer"><button type="button" class="ia-secondary" data-action="close">取消</button><button type="button" class="ia-primary" data-action="contract-save">确认登记</button></div>');}
  function renewalModal(id){state.selected=id;const d=getDevice();const dt=new Date(d.due+'T12:00:00+08:00');dt.setUTCMonth(dt.getUTCMonth()+1);modal('登记续租',d.name+' · 第一所有人 '+user(d.owner).name,'<div class="ia-information">'+icon('calendar-clock')+'<span>当前到期时间：'+d.due+' 18:00</span></div><label class="ia-field">新的到期日期（18:00）<input id="ia-renew-date" type="date" value="'+dt.toISOString().slice(0,10)+'"></label><label class="ia-field" style="display:flex;align-items:center;gap:8px"><input id="ia-renew-paid" type="checkbox" style="width:16px;margin:0;accent-color:var(--ia-brand)">已核对续租及付款记录</label><p class="ia-note">更新后重新计算 7 / 3 / 1 天提醒和到期停机时间，不会自动启动设备。</p><p id="ia-form-error" class="ia-error" role="alert"></p><div class="ia-modal-footer"><button type="button" class="ia-secondary" data-action="close">取消</button><button type="button" class="ia-primary" data-action="renew-save">确认续租</button></div>');}
  root.addEventListener('input',function(e){if(e.target.id==='ia-search'){state.query=e.target.value;drawDeviceRows();}if(e.target.id==='ia-qr'){parsed=null;root.querySelector('#ia-stock-save').disabled=true;root.querySelector('#ia-parse-output').innerHTML='';}});
  root.addEventListener('change',function(e){if(e.target.id==='ia-perm-device'){state.selected=e.target.value;render();save();}if(e.target.dataset.perm){const id=e.target.dataset.user,p=e.target.dataset.perm;draft[id][p]=e.target.checked;if(p!=='view'&&e.target.checked){draft[id].view=true;main.querySelector('[data-user="'+id+'"][data-perm="view"]').checked=true;}if(p==='view'&&!e.target.checked){['control','frequency','reset'].forEach(function(k){draft[id][k]=false;main.querySelector('[data-user="'+id+'"][data-perm="'+k+'"]').checked=false;});}main.querySelector('#ia-permission-status').textContent='有未保存的权限修改';}});
  root.addEventListener('click',function(e){const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();save();return;}if(b.dataset.authorize){go('permissions',b.dataset.authorize);return;}if(b.dataset.info){infoModal(b.dataset.info);return;}if(b.dataset.renew){renewalModal(b.dataset.renew);return;}const a=b.dataset.action;if(a==='close')close();if(a==='stock')stockModal();if(a==='parse')parseQr();if(a==='stock-save'&&parsed){const id=String(devices.length+1).padStart(2,'0');devices.push({id:id,name:'新入库 '+id+' 号变频器',vendor:parsed.vendor,model:parsed.model,module:parsed.module,owner:null,due:null,start:null,online:false,run:false,expired:false,contract:null,rent:null});permissions[id]=JSON.parse(JSON.stringify(initialPermissions));Object.keys(permissions[id]).forEach(function(k){permissions[id][k]={view:true,control:false,frequency:false,reset:false};});logs.unshift({time:'10-21 14:32',who:'管理员',action:'设备入库',device:'新入库 '+id+' 号变频器',result:'已创建档案 · 待出租'});state.filter='all';state.query='';go('devices');toast('示例设备已入库，可继续登记租赁合同。');}if(a==='contract')contractModal();if(a==='contract-save'){const contract=root.querySelector('#ia-contract-no').value.trim(),rent=Number(root.querySelector('#ia-rent').value),start=root.querySelector('#ia-start').value,end=root.querySelector('#ia-end').value,paid=root.querySelector('#ia-paid').checked,error=root.querySelector('#ia-form-error');if(!contract||!rent||rent<=0||!start||!end||end<=start||!paid){error.textContent='请填写有效合同、金额和租期，并核对付款。';return;}if(devices.some(function(d){return d.contract===contract;})){error.textContent='合同编号已存在，请使用新的编号。';return;}const d=getDevice(root.querySelector('#ia-contract-device').value);d.owner=root.querySelector('#ia-contract-owner').value;d.contract=contract;d.rent=rent;d.start=start;d.due=end;d.expired=days(d)<0;permissions[d.id][d.owner]={view:true,control:false,frequency:false,reset:false};logs.unshift({time:'10-21 14:32',who:'管理员',action:'租赁登记',device:d.name,result:'第一所有人：'+user(d.owner).name});go('leases');toast('合同已登记 · 控制权限仍需单独授权。');}if(a==='renew-save'){const d=getDevice(),date=root.querySelector('#ia-renew-date').value,paid=root.querySelector('#ia-renew-paid').checked;if(!date||date<=d.due||date<='2026-10-21'||!paid){root.querySelector('#ia-form-error').textContent='请选择晚于原租期及今天的日期，并核对付款。';return;}d.due=date;d.expired=false;logs.unshift({time:'10-21 14:32',who:'管理员',action:'续租登记',device:d.name,result:'新到期时间 '+date+' 18:00'});close();render();save();toast('示例续租已登记 · 已更新到期计划，设备不会自动启动。');}if(a==='save-permissions'){permissions[state.selected]=JSON.parse(JSON.stringify(draft));logs.unshift({time:'10-21 14:32',who:'管理员',action:'权限调整',device:getDevice().name,result:'已保存 3 位用户的权限'});main.querySelector('#ia-permission-status').textContent='授权已保存';toast('示例授权已保存 · 第一所有人保持不变。');save();}});
  root.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'&&!layer.hidden){const f=Array.from(layer.querySelectorAll('button:not(:disabled),input,select'));if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:function(){render();save();}});tweak.addSlider(state,'rowSpace',{label:'表格行间距',min:10,max:22,step:2,unit:'px'});}
})();
</script>
